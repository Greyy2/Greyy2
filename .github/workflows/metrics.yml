name: Generate GitHub Metrics

on:
  schedule:
    # Chạy mỗi ngày lúc 0h UTC (7h sáng VN)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ─── Card 1: GitHub Stats tổng quan ───────────────────────────
      - name: Generate base stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-base.svg
          user: Greyy2
          base: header, activity, community, repositories
          base_hireable: yes
          config_timezone: Asia/Ho_Chi_Minh
          config_padding: 6%, 10%
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_branch: main

      # ─── Card 2: Top languages ─────────────────────────────────────
      - name: Generate languages stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-languages.svg
          user: Greyy2
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, makefile, cmake, shell
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          config_timezone: Asia/Ho_Chi_Minh
          committer_branch: main

      # ─── Card 3: Contribution streak + wakatime-style habits ──────
      - name: Generate habits & streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-habits.svg
          user: Greyy2
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          config_timezone: Asia/Ho_Chi_Minh
          committer_branch: main

      # ─── Card 4: Achievements ──────────────────────────────────────
      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-achievements.svg
          user: Greyy2
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
          config_timezone: Asia/Ho_Chi_Minh
          committer_branch: main
